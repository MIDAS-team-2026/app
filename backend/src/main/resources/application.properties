spring.datasource.url=jdbc:mysql://localhost:3306/midas?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=ap-northeast-2
cloud.aws.s3.bucket=cognitive-storage-2026-569385762070-ap-northeast-2-an
cloud.aws.stack.auto=false


# Python AI 서버 (STT, /process, 회상 분석 모두 동일 URL)
# 실행: cd backend/ai && uvicorn fastapi_ai:app --host 0.0.0.0 --port 8000
ai.python.url=${AI_PYTHON_URL:http://localhost:8000}