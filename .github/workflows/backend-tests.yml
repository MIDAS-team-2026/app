name: Backend tests

# backend/ 가 바뀐 Pull Request 와 main 푸시에서 백엔드 단위 테스트를 자동으로 실행한다.
on:
  pull_request:
    paths:
      - "backend/src/**"
      - "backend/pom.xml"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/**"
      - "backend/pom.xml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # BackendApplicationTests 는 실제 MySQL·AWS 설정이 있어야 통과하므로 제외한다.
      # 나머지 테스트는 DB 없이 실행된다.
      - name: Run unit tests
        run: sh ./mvnw -B test -Dtest='!BackendApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false
